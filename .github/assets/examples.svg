<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B2A4A"/><stop offset="1" stop-color="#0F1A32"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5A25D"/><stop offset="1" stop-color="#E85C6B"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0652F"/><stop offset="1" stop-color="#C63F12"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBD9A3"/><stop offset="1" stop-color="#F3A77C"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E86B5"/><stop offset="1" stop-color="#3C5D86"/></linearGradient>
    <pattern id="checker" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#ffffff"/><rect width="9" height="9" fill="#dfe4ea"/><rect x="9" y="9" width="9" height="9" fill="#dfe4ea"/>
    </pattern>
  </defs>

  <rect width="1200" height="372" rx="18" fill="#EEF1F5"/>
  <text x="28" y="40" font-size="20" font-weight="800" fill="#15181E" letter-spacing="-.3">SurgePix skills — what they make</text>
  <text x="28" y="59" font-size="13" fill="#59616D">Generate, translate, cut out and inpaint — in your browser or from your agent.</text>

  <!-- Card 1: Background Remover -->
  <g transform="translate(24,78)">
    <rect width="216" height="276" rx="14" fill="#ffffff" stroke="#E2E6EC"/>
    <rect x="12" y="12" width="192" height="180" rx="10" fill="url(#checker)"/>
    <g>
      <ellipse cx="108" cy="178" rx="54" ry="11" fill="#000000" opacity="0.10"/>
      <path d="M58,192 C58,156 84,136 108,136 C132,136 158,156 158,192 Z" fill="#3E68A8"/>
      <rect x="100" y="112" width="16" height="26" rx="7" fill="#E0A87E"/>
      <ellipse cx="108" cy="90" rx="26" ry="30" fill="#E7B48D"/>
      <path d="M80,102 C74,62 92,50 108,50 C124,50 142,62 136,102 C134,80 127,72 108,72 C89,72 82,80 80,102 Z" fill="#2E2119"/>
      <circle cx="98" cy="90" r="2.6" fill="#3A2A22"/><circle cx="118" cy="90" r="2.6" fill="#3A2A22"/>
    </g>
    <circle cx="20" cy="226" r="4" fill="#E8562D"/>
    <text x="32" y="230" font-size="14.5" font-weight="600" fill="#15181E">Background Remover</text>
    <text x="16" y="252" font-size="12" fill="#59616D">Transparent PNG, hair kept</text>
  </g>

  <!-- Card 2: AI Presentation -->
  <g transform="translate(258,78)">
    <rect width="216" height="276" rx="14" fill="#ffffff" stroke="#E2E6EC"/>
    <rect x="12" y="12" width="192" height="180" rx="10" fill="url(#navy)"/>
    <rect x="28" y="30" width="26" height="4" rx="2" fill="#FF7A4D"/>
    <rect x="28" y="44" width="120" height="9" rx="4" fill="#F4F7FC"/>
    <rect x="28" y="58" width="92" height="9" rx="4" fill="#F4F7FC"/>
    <g fill="#A7B4CF">
      <circle cx="32" cy="92" r="3"/><rect x="40" y="89" width="80" height="6" rx="3"/>
      <circle cx="32" cy="110" r="3"/><rect x="40" y="107" width="96" height="6" rx="3"/>
      <circle cx="32" cy="128" r="3"/><rect x="40" y="125" width="70" height="6" rx="3"/>
    </g>
    <g>
      <rect x="150" y="150" width="10" height="26" rx="2" fill="#2E3D5C"/>
      <rect x="164" y="138" width="10" height="38" rx="2" fill="#2E3D5C"/>
      <rect x="178" y="120" width="10" height="56" rx="2" fill="#FF7A4D"/>
    </g>
    <circle cx="20" cy="226" r="4" fill="#E8562D"/>
    <text x="32" y="230" font-size="14.5" font-weight="600" fill="#15181E">AI Presentation</text>
    <text x="16" y="252" font-size="12" fill="#59616D">Editable .pptx from a prompt</text>
  </g>

  <!-- Card 3: Image Translator -->
  <g transform="translate(492,78)">
    <rect width="216" height="276" rx="14" fill="#ffffff" stroke="#E2E6EC"/>
    <rect x="12" y="12" width="192" height="180" rx="10" fill="url(#warm)"/>
    <circle cx="176" cy="44" r="30" fill="#ffffff" opacity="0.16"/>
    <rect x="28" y="34" width="46" height="16" rx="8" fill="#ffffff" opacity="0.22"/>
    <text x="36" y="46" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="1">CAFE</text>
    <rect x="28" y="64" width="128" height="14" rx="4" fill="#FFF4E8"/>
    <rect x="28" y="84" width="96" height="14" rx="4" fill="#FFF4E8"/>
    <g transform="translate(28,124)">
      <rect width="92" height="26" rx="13" fill="#15181E" opacity="0.85"/>
      <text x="14" y="18" font-size="12.5" font-weight="600" fill="#ffffff">EN</text>
      <text x="40" y="18" font-size="12.5" fill="#FFC7A6">→</text>
      <text x="56" y="18" font-size="12.5" font-weight="600" fill="#ffffff">ES</text>
    </g>
    <circle cx="20" cy="226" r="4" fill="#E8562D"/>
    <text x="32" y="230" font-size="14.5" font-weight="600" fill="#15181E">Image Translator</text>
    <text x="16" y="252" font-size="12" fill="#59616D">Text in-place, layout kept</text>
  </g>

  <!-- Card 4: AI Inpainting -->
  <g transform="translate(726,78)">
    <rect width="216" height="276" rx="14" fill="#ffffff" stroke="#E2E6EC"/>
    <clipPath id="clip4"><rect x="12" y="12" width="192" height="180" rx="10"/></clipPath>
    <g clip-path="url(#clip4)">
      <rect x="12" y="12" width="192" height="180" fill="url(#sky)"/>
      <circle cx="70" cy="58" r="24" fill="#FFF0C8" opacity="0.9"/>
      <path d="M12,112 Q70,92 130,110 T204,106 L204,122 L12,122 Z" fill="#B97A62"/>
      <rect x="12" y="118" width="192" height="74" fill="url(#water)"/>
      <g fill="#9FC0E0" opacity="0.5"><rect x="26" y="150" width="56" height="3" rx="1.5"/><rect x="120" y="168" width="66" height="3" rx="1.5"/></g>
      <g>
        <path d="M128,150 L168,150 L162,162 L134,162 Z" fill="#E8E2D6"/>
        <rect x="146" y="128" width="3" height="22" fill="#6B4A30"/>
        <path d="M149,130 L149,150 L168,150 Z" fill="#E8562D"/>
      </g>
    </g>
    <rect x="120" y="124" width="60" height="48" rx="6" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="120" y="108" width="52" height="16" rx="5" fill="#E8562D"/>
    <text x="126" y="120" font-size="10" font-weight="600" fill="#ffffff">select</text>
    <circle cx="20" cy="226" r="4" fill="#E8562D"/>
    <text x="32" y="230" font-size="14.5" font-weight="600" fill="#15181E">AI Inpainting</text>
    <text x="16" y="252" font-size="12" fill="#59616D">Change one spot, keep the rest</text>
  </g>

  <!-- Card 5: RED Carousel -->
  <g transform="translate(960,78)">
    <rect width="216" height="276" rx="14" fill="#ffffff" stroke="#E2E6EC"/>
    <rect x="12" y="12" width="192" height="180" rx="10" fill="#F6F2EE"/>
    <g transform="translate(118,30)">
      <rect width="74" height="132" rx="9" fill="#FFF3EC" stroke="#eadfd6"/>
      <rect x="12" y="14" width="22" height="22" rx="6" fill="#F0652F"/>
      <text x="19" y="30" font-size="13" font-weight="700" fill="#ffffff">2</text>
      <rect x="12" y="46" width="50" height="8" rx="4" fill="#3A2417"/>
      <rect x="12" y="60" width="40" height="6" rx="3" fill="#8a776a"/>
      <rect x="12" y="74" width="44" height="6" rx="3" fill="#8a776a"/>
    </g>
    <g transform="translate(30,22)">
      <rect width="80" height="148" rx="10" fill="url(#coral)"/>
      <rect x="12" y="14" width="34" height="14" rx="7" fill="#ffffff" opacity="0.25"/>
      <rect x="12" y="92" width="56" height="12" rx="4" fill="#ffffff"/>
      <rect x="12" y="110" width="44" height="12" rx="4" fill="#ffffff"/>
      <rect x="12" y="130" width="30" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
    </g>
    <circle cx="20" cy="226" r="4" fill="#E8562D"/>
    <text x="32" y="230" font-size="14.5" font-weight="600" fill="#15181E">RED Carousel</text>
    <text x="16" y="252" font-size="12" fill="#59616D">Cover + content, vertical set</text>
  </g>
</svg>
